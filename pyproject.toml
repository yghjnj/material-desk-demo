[project]
name = "enterprise-technical-assistant"
version = "0.1.0"
description = "Contract-first MVP for evidence-grounded industrial technical support."
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi==0.137.1",
  "uvicorn==0.48.0",
  "pydantic==2.13.4",
  "PyMuPDF==1.27.2.3",
  "python-docx==1.2.0",
]

[project.optional-dependencies]
test = ["pytest==9.1.0"]
